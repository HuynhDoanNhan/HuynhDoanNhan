<svg
  width="900"
  height="70"
  viewBox="0 0 900 70"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <linearGradient id="animatedGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7DCFFF">
        <animate
          attributeName="stop-color"
          values="#7DCFFF;#7AA2F7;#BB9AF7;#7DCFFF"
          dur="6s"
          repeatCount="indefinite"
        />
      </stop>

      <stop offset="50%" stop-color="#7AA2F7">
        <animate
          attributeName="stop-color"
          values="#7AA2F7;#BB9AF7;#7DCFFF;#7AA2F7"
          dur="6s"
          repeatCount="indefinite"
        />
      </stop>

      <stop offset="100%" stop-color="#BB9AF7">
        <animate
          attributeName="stop-color"
          values="#BB9AF7;#7DCFFF;#7AA2F7;#BB9AF7"
          dur="6s"
          repeatCount="indefinite"
        />
      </stop>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="0.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <text
    x="450"
    y="42"
    text-anchor="middle"
    font-family="Fira Code, JetBrains Mono, Consolas, monospace"
    font-size="22"
    font-weight="600"
    fill="url(#animatedGradient)"
    filter="url(#softGlow)"
  >
    Java Backend • Spring Boot • REST APIs • Database Systems
  </text>
</svg>
