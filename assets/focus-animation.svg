<svg
  width="820"
  height="70"
  viewBox="0 0 820 70"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7DCFFF"/>
      <stop offset="55%" stop-color="#7AA2F7"/>
      <stop offset="100%" stop-color="#BB9AF7"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g
    text-anchor="middle"
    font-family="Fira Code, JetBrains Mono, Consolas, monospace"
    font-size="22"
    font-weight="600"
    fill="url(#accent)"
    filter="url(#softGlow)"
  >

    <!-- 1. Java Backend -->
    <text x="410" y="40" opacity="0">
      Java Backend Development

      <animate
        attributeName="opacity"
        dur="16s"
        repeatCount="indefinite"
        values="0;1;1;0;0"
        keyTimes="0;0.03;0.20;0.24;1"
      />

      <animate
        attributeName="y"
        dur="16s"
        repeatCount="indefinite"
        values="46;38;38;34;34"
        keyTimes="0;0.03;0.20;0.24;1"
      />
    </text>

    <!-- 2. Web & Desktop -->
    <text x="410" y="40" opacity="0">
      Building Web &amp; Desktop Applications

      <animate
        attributeName="opacity"
        dur="16s"
        repeatCount="indefinite"
        values="0;0;1;1;0;0"
        keyTimes="0;0.25;0.28;0.45;0.49;1"
      />

      <animate
        attributeName="y"
        dur="16s"
        repeatCount="indefinite"
        values="46;46;38;38;34;34"
        keyTimes="0;0.25;0.28;0.45;0.49;1"
      />
    </text>

    <!-- 3. Spring Boot -->
    <text x="410" y="40" opacity="0">
      Learning Spring Boot &amp; REST APIs

      <animate
        attributeName="opacity"
        dur="16s"
        repeatCount="indefinite"
        values="0;0;1;1;0;0"
        keyTimes="0;0.50;0.53;0.70;0.74;1"
      />

      <animate
        attributeName="y"
        dur="16s"
        repeatCount="indefinite"
        values="46;46;38;38;34;34"
        keyTimes="0;0.50;0.53;0.70;0.74;1"
      />
    </text>

    <!-- 4. Foundations -->
    <text x="410" y="40" opacity="0">
      Database Systems • OOP • Software Design

      <animate
        attributeName="opacity"
        dur="16s"
        repeatCount="indefinite"
        values="0;0;1;1;0"
        keyTimes="0;0.75;0.78;0.95;1"
      />

      <animate
        attributeName="y"
        dur="16s"
        repeatCount="indefinite"
        values="46;46;38;38;34"
        keyTimes="0;0.75;0.78;0.95;1"
      />
    </text>

  </g>
</svg>
